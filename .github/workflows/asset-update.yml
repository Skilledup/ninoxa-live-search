# Push readme.txt / directory assets to WordPress.org without a new version tag.
# Skips the commit if plugin code also changed since the last SVN deploy.
name: Update WordPress.org assets

on:
  push:
    branches:
      - master
    paths:
      - readme.txt
      - .wordpress-org/**

jobs:
  trunk:
    name: Sync readme and assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: WordPress.org plugin asset/readme update
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: ninoxa-live-search
